name: Validate offline E2E fix

on:
  push:
    branches: [ci/e2e-offline-validation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check offline E2E contracts
        run: >-
          npx vitest run --project e2e
          tests/e2e/plugin-management.test.ts tests/e2e/public-commands.test.ts
          -t "plugin management E2E|public command restriction detectors"
          --reporter=verbose
